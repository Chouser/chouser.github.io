<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HealthLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --cream-dark: #f5ead8;
    --cream-border: #e8d8c0;
    --terracotta: #c8654a;
    --terracotta-light: #e8937a;
    --terracotta-dark: #a04d35;
    --sage: #6a8f6e;
    --sage-light: #9ab89e;
    --sage-pale: #eaf2eb;
    --warm-brown: #5c3d2e;
    --warm-brown-light: #8a6555;
    --text-primary: #3a2416;
    --text-secondary: #7a5c4a;
    --text-muted: #b09080;
    --white: #ffffff;
    --shadow-sm: 0 2px 8px rgba(90,50,30,0.08);
    --shadow-md: 0 4px 20px rgba(90,50,30,0.12);
    --shadow-lg: 0 8px 40px rgba(90,50,30,0.18);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
    color: var(--text-primary);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── VIEWS ── */
  .view {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  .view.active { display: flex; }

  /* ── SCROLLABLE CONTENT ── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 90px;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--white);
    border-top: 1.5px solid var(--cream-border);
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(90,50,30,0.08);
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 14px;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-btn.active { color: var(--terracotta); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ── ENTRY VIEW ── */
  .entry-header {
    background: var(--white);
    padding: 16px 20px 0;
    border-bottom: 1.5px solid var(--cream-border);
    box-shadow: var(--shadow-sm);
  }

  .app-title {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--warm-brown);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .app-title span { color: var(--terracotta); }

  /* ── DATETIME BAR ── */
  .datetime-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .datetime-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    border: 1.5px solid var(--cream-border);
    border-radius: 50px;
    padding: 8px 14px;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 0;
  }
  .datetime-pill:active { background: var(--cream-dark); }
  .datetime-pill.modified {
    background: #fff3ee;
    border-color: var(--terracotta-light);
  }
  .datetime-pill-icon { font-size: 15px; flex-shrink: 0; }
  .datetime-pill-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .datetime-pill.modified .datetime-pill-text { color: var(--terracotta-dark); }

  .now-reset {
    background: var(--terracotta);
    color: var(--white);
    border: none;
    border-radius: 50px;
    padding: 8px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .now-reset:active { background: var(--terracotta-dark); }

  /* Hidden datetime input */
  #datetime-input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px; height: 1px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tab-btn.active {
    color: var(--terracotta);
    border-bottom-color: var(--terracotta);
  }

  /* ── TAB PANELS ── */
  .tab-panel { display: none; padding: 20px; }
  .tab-panel.active { display: block; }

  /* ── FOOD ITEMS ── */
  .food-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .food-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--sage-pale);
    border: 1.5px solid var(--sage-light);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    animation: chipIn 0.2s ease;
  }
  @keyframes chipIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .food-chip-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--warm-brown);
  }
  .food-chip-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 50%;
    line-height: 1;
    transition: all 0.15s;
  }
  .food-chip-remove:active { background: var(--cream-border); color: var(--terracotta); }

  /* ── AUTOCOMPLETE INPUT ── */
  .autocomplete-wrap {
    position: relative;
  }

  .field-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display: block;
  }

  .text-input {
    width: 100%;
    background: var(--white);
    border: 1.5px solid var(--cream-border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .text-input:focus {
    border-color: var(--terracotta-light);
    box-shadow: 0 0 0 3px rgba(200,101,74,0.12);
  }
  .text-input::placeholder { color: var(--text-muted); }

  textarea.text-input {
    resize: none;
    min-height: 120px;
    line-height: 1.6;
  }

  .autocomplete-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--white);
    border: 1.5px solid var(--cream-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    z-index: 50;
    overflow: hidden;
    max-height: 220px;
    overflow-y: auto;
  }
  .autocomplete-dropdown.open { display: block; }

  .autocomplete-item {
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 1px solid var(--cream-dark);
    color: var(--text-primary);
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item.highlighted { background: var(--cream); }
  .autocomplete-item .new-badge {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--terracotta);
    color: var(--white);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: auto;
  }

  /* ── SAVE BUTTON ── */
  .save-btn {
    width: 100%;
    background: var(--terracotta);
    color: var(--white);
    border: none;
    border-radius: var(--radius-md);
    padding: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 24px;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .save-btn:active { background: var(--terracotta-dark); transform: scale(0.98); }
  .save-btn:disabled { background: var(--text-muted); cursor: not-allowed; }

  /* ── OBSERVATION TAB ── */
  .obs-type-wrap { margin-bottom: 16px; }
  .obs-notes-wrap { }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--warm-brown);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── HISTORY VIEW ── */
  .history-header {
    background: var(--white);
    padding: 16px 20px;
    border-bottom: 1.5px solid var(--cream-border);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .history-title {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--warm-brown);
  }

  .export-btn {
    background: var(--sage-pale);
    border: 1.5px solid var(--sage-light);
    color: var(--sage);
    border-radius: 50px;
    padding: 8px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .export-btn:active { background: var(--sage-light); color: var(--white); }

  /* ── DAY GROUPS ── */
  .day-group { }
  .day-label {
    padding: 18px 20px 8px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 10;
  }

  .entry-card {
    margin: 0 16px 10px;
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1.5px solid transparent;
  }
  .entry-card:active { transform: scale(0.98); box-shadow: none; border-color: var(--cream-border); }

  .entry-type-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .entry-type-icon.meal { background: #fff3ee; }
  .entry-type-icon.observation { background: #eef4ff; }

  .entry-card-body { flex: 1; min-width: 0; }
  .entry-card-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .entry-card-summary {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-card-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .entry-card-arrow {
    color: var(--text-muted);
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 8px;
  }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 80px;
    right: calc(50% - 220px);
    width: 56px;
    height: 56px;
    background: var(--terracotta);
    color: var(--white);
    border: none;
    border-radius: 50%;
    font-size: 28px;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99;
    transition: background 0.2s, transform 0.15s;
  }
  .fab:active { background: var(--terracotta-dark); transform: scale(0.92); }

  @media (max-width: 480px) {
    .fab { right: 20px; }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 30px;
    text-align: center;
    gap: 12px;
  }
  .empty-state-icon { font-size: 48px; }
  .empty-state-title {
    font-family: 'Lora', serif;
    font-size: 20px;
    color: var(--warm-brown);
  }
  .empty-state-sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(60,30,15,0.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--cream);
    width: 100%;
    max-width: 480px;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--cream-border);
    border-radius: 2px;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1.5px solid var(--cream-border);
    flex-shrink: 0;
  }
  .modal-title {
    font-family: 'Lora', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--warm-brown);
  }
  .modal-close {
    background: var(--cream-dark);
    border: none;
    border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: background 0.2s;
  }
  .modal-close:active { background: var(--cream-border); }

  .modal-body {
    overflow-y: auto;
    padding: 20px;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }

  .modal-footer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1.5px solid var(--cream-border);
    flex-shrink: 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }

  .btn-secondary {
    flex: 1;
    background: var(--cream);
    border: 1.5px solid var(--cream-border);
    border-radius: var(--radius-md);
    padding: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-secondary:active { background: var(--cream-dark); }

  .btn-danger {
    flex: 1;
    background: #fff0ee;
    border: 1.5px solid #f5c5bc;
    border-radius: var(--radius-md);
    padding: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--terracotta-dark);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-danger:active { background: #ffe0dc; }

  .btn-primary {
    flex: 2;
    background: var(--terracotta);
    border: none;
    border-radius: var(--radius-md);
    padding: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--white);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:active { background: var(--terracotta-dark); }

  /* ── MODAL DATETIME ── */
  .modal-datetime {
    margin-bottom: 16px;
  }
  .modal-datetime .text-input {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }

  /* ── SECTION DIVIDER ── */
  .section-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--cream-border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════════ ENTRY VIEW ═══════════════ -->
  <div id="view-entry" class="view active">
    <div class="entry-header">
      <div class="app-title">🌿 Health<span>Log</span></div>
      <div class="datetime-bar">
        <div class="datetime-pill" id="datetime-pill" onclick="openDatetimePicker()">
          <span class="datetime-pill-icon">🕐</span>
          <span class="datetime-pill-text" id="datetime-display">Loading...</span>
        </div>
        <button class="now-reset" id="now-reset-btn" onclick="resetToNow()" style="display:none">↺ Now</button>
        <input type="datetime-local" id="datetime-input" onchange="onDatetimeChange(this.value)">
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-meal" onclick="switchTab('meal')">🍽 Meal</button>
        <button class="tab-btn" id="tab-obs" onclick="switchTab('obs')">🩺 Observation</button>
      </div>
    </div>

    <div class="scroll-area">
      <!-- MEAL PANEL -->
      <div class="tab-panel active" id="panel-meal">
        <div id="food-list" class="food-list"></div>
        <div class="autocomplete-wrap">
          <label class="field-label" for="food-input">Add food item</label>
          <input
            class="text-input"
            type="text"
            id="food-input"
            placeholder="e.g. Oatmeal with berries…"
            autocomplete="off"
            oninput="onFoodInput(this)"
            onkeydown="onFoodKeydown(event)"
            onfocus="onFoodInput(this)"
          >
          <div class="autocomplete-dropdown" id="food-dropdown"></div>
        </div>
        <button class="save-btn" onclick="saveEntry()">
          ✓ Save Meal
        </button>
      </div>

      <!-- OBSERVATION PANEL -->
      <div class="tab-panel" id="panel-obs">
        <div class="obs-type-wrap autocomplete-wrap">
          <label class="field-label" for="obs-type-input">Observation type</label>
          <input
            class="text-input"
            type="text"
            id="obs-type-input"
            placeholder="e.g. Symptoms, Blood pressure…"
            autocomplete="off"
            oninput="onObsTypeInput(this)"
            onkeydown="onObsTypeKeydown(event)"
            onfocus="onObsTypeInput(this)"
          >
          <div class="autocomplete-dropdown" id="obs-type-dropdown"></div>
        </div>
        <div class="obs-notes-wrap" style="margin-top:16px">
          <label class="field-label" for="obs-notes">Notes</label>
          <textarea class="text-input" id="obs-notes" placeholder="Describe your observation in detail…"></textarea>
        </div>
        <button class="save-btn" onclick="saveEntry()">
          ✓ Save Observation
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ HISTORY VIEW ═══════════════ -->
  <div id="view-history" class="view">
    <div class="history-header">
      <div class="history-title">📋 History</div>
      <button class="export-btn" onclick="exportCSV()">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
    </div>
    <div class="scroll-area" id="history-scroll">
      <div id="history-list"></div>
    </div>
    <button class="fab" onclick="goToEntry()" title="New Entry">+</button>
  </div>

  <!-- ═══════════════ BOTTOM NAV ═══════════════ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-entry" onclick="showView('entry')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Log
    </button>
    <button class="nav-btn" id="nav-history" onclick="showView('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      History
    </button>
  </nav>

  <!-- ═══════════════ EDIT MODAL ═══════════════ -->
  <div class="modal-overlay" id="edit-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Edit Entry</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-danger" onclick="deleteEntry()">Delete</button>
        <button class="btn-primary" onclick="saveEditedEntry()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ TOAST ═══════════════ -->
  <div class="toast" id="toast"></div>
</div>

<script>
// ══════════════════════════════════════════
// STORAGE & SCHEMA
// ══════════════════════════════════════════
const SCHEMA_VERSION = 1;
const STORAGE_KEYS = {
  meta: 'healthlog_meta',
  entries: 'healthlog_entries',
  foods: 'healthlog_foods',
  obsTypes: 'healthlog_obs_types',
};

const DEFAULT_OBS_TYPES = ['Symptoms', 'Blood pressure', 'Vitals', 'Mood', 'Energy', 'Sleep quality', 'Pain', 'Medication', 'Allergic reaction'];

function loadStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}

function saveStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) { console.error('Storage error', e); }
}

function initStorage() {
  const meta = loadStore(STORAGE_KEYS.meta, null);
  if (!meta) {
    saveStore(STORAGE_KEYS.meta, { schemaVersion: SCHEMA_VERSION, createdAt: new Date().toISOString() });
    saveStore(STORAGE_KEYS.entries, []);
    saveStore(STORAGE_KEYS.foods, []);
    saveStore(STORAGE_KEYS.obsTypes, DEFAULT_OBS_TYPES);
  } else {
    // Future migrations would go here: if (meta.schemaVersion < 2) { migrate_v1_to_v2(); }
    const obsTypes = loadStore(STORAGE_KEYS.obsTypes, []);
    if (obsTypes.length === 0) saveStore(STORAGE_KEYS.obsTypes, DEFAULT_OBS_TYPES);
  }
}

function getEntries() { return loadStore(STORAGE_KEYS.entries, []); }
function getFoods() { return loadStore(STORAGE_KEYS.foods, []); }
function getObsTypes() { return loadStore(STORAGE_KEYS.obsTypes, DEFAULT_OBS_TYPES); }

function saveEntries(arr) { saveStore(STORAGE_KEYS.entries, arr); }
function saveFoods(arr) { saveStore(STORAGE_KEYS.foods, arr); }
function saveObsTypes(arr) { saveStore(STORAGE_KEYS.obsTypes, arr); }

function ensureFood(name) {
  const trimmed = name.trim();
  if (!trimmed) return;
  const foods = getFoods();
  if (!foods.find(f => f.name.toLowerCase() === trimmed.toLowerCase())) {
    foods.push({ id: uuid(), name: trimmed, createdAt: new Date().toISOString() });
    saveFoods(foods);
  }
}

function ensureObsType(type) {
  const trimmed = type.trim();
  if (!trimmed) return;
  const types = getObsTypes();
  if (!types.find(t => t.toLowerCase() === trimmed.toLowerCase())) {
    types.push(trimmed);
    saveObsTypes(types);
  }
}

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let currentTab = 'meal';
let currentFoodItems = [];
let selectedDatetime = null; // null = "now"
let clockInterval = null;
let editingEntryId = null;

// Autocomplete state
let foodACIndex = -1;
let obsTypeACIndex = -1;

// ══════════════════════════════════════════
// DATETIME
// ══════════════════════════════════════════
function formatDisplay(dt) {
  const now = new Date();
  const isToday = dt.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
  const isYesterday = dt.toDateString() === yesterday.toDateString();
  const timeStr = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (isToday) return `Today · ${timeStr}`;
  if (isYesterday) return `Yesterday · ${timeStr}`;
  return dt.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` · ${timeStr}`;
}

function updateClock() {
  if (selectedDatetime !== null) return;
  const pill = document.getElementById('datetime-display');
  if (pill) pill.textContent = formatDisplay(new Date());
}

function startClock() {
  updateClock();
  clockInterval = setInterval(updateClock, 10000);
}

function openDatetimePicker() {
  const input = document.getElementById('datetime-input');
  const now = selectedDatetime || new Date();
  // Format for datetime-local: YYYY-MM-DDTHH:MM
  const pad = n => String(n).padStart(2, '0');
  input.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  input.showPicker ? input.showPicker() : input.click();
}

function onDatetimeChange(value) {
  if (!value) return;
  selectedDatetime = new Date(value);
  document.getElementById('datetime-display').textContent = formatDisplay(selectedDatetime);
  document.getElementById('datetime-pill').classList.add('modified');
  document.getElementById('now-reset-btn').style.display = '';
  clearInterval(clockInterval);
}

function resetToNow() {
  selectedDatetime = null;
  document.getElementById('datetime-pill').classList.remove('modified');
  document.getElementById('now-reset-btn').style.display = 'none';
  updateClock();
  startClock();
}

function getEffectiveDatetime() {
  return selectedDatetime || new Date();
}

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-meal').classList.toggle('active', tab === 'meal');
  document.getElementById('tab-obs').classList.toggle('active', tab === 'obs');
  document.getElementById('panel-meal').classList.toggle('active', tab === 'meal');
  document.getElementById('panel-obs').classList.toggle('active', tab === 'obs');
  closeAllDropdowns();
}

// ══════════════════════════════════════════
// FOOD AUTOCOMPLETE
// ══════════════════════════════════════════
function getFoodSuggestions(query) {
  const foods = getFoods().map(f => f.name);
  // Also include items already in the current session
  const q = query.trim().toLowerCase();
  if (!q) return foods.slice(0, 6);
  const exact = foods.filter(f => f.toLowerCase() === q);
  const prefix = foods.filter(f => f.toLowerCase().startsWith(q) && f.toLowerCase() !== q);
  const fuzzy = foods.filter(f => f.toLowerCase().includes(q) && !f.toLowerCase().startsWith(q));
  const results = [...exact, ...prefix, ...fuzzy].slice(0, 6);
  // If typed value isn't in the list, offer to add it
  if (q && !foods.find(f => f.toLowerCase() === q)) {
    results.push({ newItem: true, name: query.trim() });
  }
  return results;
}

function onFoodInput(input) {
  foodACIndex = -1;
  const q = input.value;
  const suggestions = getFoodSuggestions(q);
  const dd = document.getElementById('food-dropdown');
  if (!suggestions.length || (!q && currentFoodItems.length > 0)) {
    dd.classList.remove('open'); return;
  }
  renderDropdown(dd, suggestions, idx => selectFood(suggestions[idx]));
  dd.classList.add('open');
}

function selectFood(item) {
  const name = typeof item === 'string' ? item : item.name;
  if (!name.trim()) return;
  currentFoodItems.push(name.trim());
  document.getElementById('food-input').value = '';
  document.getElementById('food-dropdown').classList.remove('open');
  renderFoodList();
  foodACIndex = -1;
}

function onFoodKeydown(e) {
  const dd = document.getElementById('food-dropdown');
  const items = dd.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); foodACIndex = Math.min(foodACIndex+1, items.length-1); highlightItem(items, foodACIndex); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); foodACIndex = Math.max(foodACIndex-1, -1); highlightItem(items, foodACIndex); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (foodACIndex >= 0 && items[foodACIndex]) { items[foodACIndex].click(); }
    else { const v = document.getElementById('food-input').value.trim(); if (v) selectFood(v); }
  }
  else if (e.key === 'Escape') { dd.classList.remove('open'); }
}

function renderFoodList() {
  const list = document.getElementById('food-list');
  list.innerHTML = currentFoodItems.map((item, i) => `
    <div class="food-chip">
      <span class="food-chip-name">🥗 ${escHtml(item)}</span>
      <button class="food-chip-remove" onclick="removeFood(${i})">×</button>
    </div>
  `).join('');
}

function removeFood(i) {
  currentFoodItems.splice(i, 1);
  renderFoodList();
}

// ══════════════════════════════════════════
// OBS TYPE AUTOCOMPLETE
// ══════════════════════════════════════════
function getObsTypeSuggestions(query) {
  const types = getObsTypes();
  const q = query.trim().toLowerCase();
  if (!q) return types.slice(0, 6);
  const prefix = types.filter(t => t.toLowerCase().startsWith(q));
  const fuzzy = types.filter(t => t.toLowerCase().includes(q) && !t.toLowerCase().startsWith(q));
  const results = [...prefix, ...fuzzy].slice(0, 6);
  if (q && !types.find(t => t.toLowerCase() === q)) {
    results.push({ newItem: true, name: query.trim() });
  }
  return results;
}

function onObsTypeInput(input) {
  obsTypeACIndex = -1;
  const q = input.value;
  const suggestions = getObsTypeSuggestions(q);
  const dd = document.getElementById('obs-type-dropdown');
  if (!suggestions.length) { dd.classList.remove('open'); return; }
  renderDropdown(dd, suggestions, idx => selectObsType(suggestions[idx]));
  dd.classList.add('open');
}

function selectObsType(item) {
  const name = typeof item === 'string' ? item : item.name;
  document.getElementById('obs-type-input').value = name;
  document.getElementById('obs-type-dropdown').classList.remove('open');
  obsTypeACIndex = -1;
}

function onObsTypeKeydown(e) {
  const dd = document.getElementById('obs-type-dropdown');
  const items = dd.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); obsTypeACIndex = Math.min(obsTypeACIndex+1, items.length-1); highlightItem(items, obsTypeACIndex); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); obsTypeACIndex = Math.max(obsTypeACIndex-1, -1); highlightItem(items, obsTypeACIndex); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (obsTypeACIndex >= 0 && items[obsTypeACIndex]) { items[obsTypeACIndex].click(); }
    else { dd.classList.remove('open'); }
  }
  else if (e.key === 'Escape') { dd.classList.remove('open'); }
}

// ══════════════════════════════════════════
// DROPDOWN RENDERING
// ══════════════════════════════════════════
function renderDropdown(dd, suggestions, onSelect) {
  dd.innerHTML = suggestions.map((s, i) => {
    const isNew = typeof s === 'object' && s.newItem;
    const name = typeof s === 'string' ? s : s.name;
    return `<div class="autocomplete-item" data-idx="${i}">
      ${escHtml(name)}${isNew ? '<span class="new-badge">New</span>' : ''}
    </div>`;
  }).join('');
  dd.querySelectorAll('.autocomplete-item').forEach((el, i) => {
    el.addEventListener('mousedown', e => { e.preventDefault(); onSelect(i); });
    el.addEventListener('touchend', e => { e.preventDefault(); onSelect(i); });
  });
}

function highlightItem(items, idx) {
  items.forEach((el, i) => el.classList.toggle('highlighted', i === idx));
}

function closeAllDropdowns() {
  document.querySelectorAll('.autocomplete-dropdown').forEach(d => d.classList.remove('open'));
}

// ══════════════════════════════════════════
// SAVE ENTRY
// ══════════════════════════════════════════
function saveEntry() {
  const ts = getEffectiveDatetime();

  if (currentTab === 'meal') {
    if (currentFoodItems.length === 0) { showToast('Add at least one food item'); return; }
    currentFoodItems.forEach(name => ensureFood(name));
    const entry = {
      id: uuid(),
      schemaVersion: SCHEMA_VERSION,
      type: 'meal',
      timestamp: ts.toISOString(),
      createdAt: new Date().toISOString(),
      payload: { items: currentFoodItems.map(name => ({ name })) }
    };
    const entries = getEntries();
    entries.push(entry);
    saveEntries(entries);
    currentFoodItems = [];
    renderFoodList();
    document.getElementById('food-input').value = '';
    showToast('✓ Meal saved');
  } else {
    const type = document.getElementById('obs-type-input').value.trim();
    const notes = document.getElementById('obs-notes').value.trim();
    if (!type) { showToast('Enter an observation type'); return; }
    ensureObsType(type);
    const entry = {
      id: uuid(),
      schemaVersion: SCHEMA_VERSION,
      type: 'observation',
      timestamp: ts.toISOString(),
      createdAt: new Date().toISOString(),
      payload: { observationType: type, notes }
    };
    const entries = getEntries();
    entries.push(entry);
    saveEntries(entries);
    document.getElementById('obs-type-input').value = '';
    document.getElementById('obs-notes').value = '';
    showToast('✓ Observation saved');
  }

  resetToNow();
}

// ══════════════════════════════════════════
// HISTORY VIEW
// ══════════════════════════════════════════
function renderHistory() {
  const entries = getEntries().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  const list = document.getElementById('history-list');

  if (!entries.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">🌱</div>
      <div class="empty-state-title">Nothing logged yet</div>
      <div class="empty-state-sub">Tap the + button or switch to Log to add your first entry.</div>
    </div>`;
    return;
  }

  // Group by day
  const groups = {};
  entries.forEach(e => {
    const d = new Date(e.timestamp).toDateString();
    if (!groups[d]) groups[d] = [];
    groups[d].push(e);
  });

  const now = new Date();
  const todayStr = now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  const yesterdayStr = yesterday.toDateString();

  list.innerHTML = Object.keys(groups).map(dayStr => {
    let label;
    if (dayStr === todayStr) label = 'Today';
    else if (dayStr === yesterdayStr) label = 'Yesterday';
    else label = new Date(dayStr).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

    const cards = groups[dayStr].map(e => {
      const time = new Date(e.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let icon, summary, sub;
      if (e.type === 'meal') {
        icon = '🍽';
        const items = e.payload.items || [];
        summary = items.map(i => i.name).join(', ') || 'Empty meal';
        sub = `${items.length} item${items.length !== 1 ? 's' : ''}`;
      } else {
        icon = '🩺';
        summary = e.payload.observationType || 'Observation';
        sub = e.payload.notes || '';
      }
      return `<div class="entry-card" onclick="openEditModal('${e.id}')">
        <div class="entry-type-icon ${e.type}">${icon}</div>
        <div class="entry-card-body">
          <div class="entry-card-time">${time}</div>
          <div class="entry-card-summary">${escHtml(summary)}</div>
          ${sub ? `<div class="entry-card-sub">${escHtml(sub)}</div>` : ''}
        </div>
        <div class="entry-card-arrow">›</div>
      </div>`;
    }).join('');

    return `<div class="day-group">
      <div class="day-label">${label}</div>
      ${cards}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════
let modalFoodItems = [];
let modalObsACIndex = -1;

function openEditModal(id) {
  const entries = getEntries();
  const entry = entries.find(e => e.id === id);
  if (!entry) return;
  editingEntryId = id;

  const title = entry.type === 'meal' ? '🍽 Edit Meal' : '🩺 Edit Observation';
  document.getElementById('modal-title').textContent = title;

  const dt = new Date(entry.timestamp);
  const pad = n => String(n).padStart(2, '0');
  const dtValue = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

  let bodyHtml = `
    <div class="modal-datetime">
      <label class="field-label">Date & Time</label>
      <input class="text-input" type="datetime-local" id="modal-datetime" value="${dtValue}">
    </div>`;

  if (entry.type === 'meal') {
    modalFoodItems = (entry.payload.items || []).map(i => i.name);
    bodyHtml += `
      <label class="field-label">Food items</label>
      <div id="modal-food-list" class="food-list" style="margin-bottom:12px"></div>
      <div class="autocomplete-wrap">
        <input class="text-input" type="text" id="modal-food-input" placeholder="Add food item…" autocomplete="off"
          oninput="onModalFoodInput(this)" onkeydown="onModalFoodKeydown(event)" onfocus="onModalFoodInput(this)">
        <div class="autocomplete-dropdown" id="modal-food-dropdown"></div>
      </div>`;
  } else {
    bodyHtml += `
      <div class="autocomplete-wrap" style="margin-bottom:16px">
        <label class="field-label">Observation type</label>
        <input class="text-input" type="text" id="modal-obs-type" value="${escHtml(entry.payload.observationType || '')}"
          autocomplete="off" oninput="onModalObsTypeInput(this)" onkeydown="onModalObsTypeKeydown(event)" onfocus="onModalObsTypeInput(this)">
        <div class="autocomplete-dropdown" id="modal-obs-type-dropdown"></div>
      </div>
      <label class="field-label">Notes</label>
      <textarea class="text-input" id="modal-obs-notes" style="min-height:140px">${escHtml(entry.payload.notes || '')}</textarea>`;
  }

  document.getElementById('modal-body').innerHTML = bodyHtml;

  if (entry.type === 'meal') renderModalFoodList();

  document.getElementById('edit-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  document.body.style.overflow = '';
  editingEntryId = null;
  modalFoodItems = [];
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById('edit-modal')) closeModal();
}

// Modal food autocomplete
function onModalFoodInput(input) {
  const suggestions = getFoodSuggestions(input.value);
  const dd = document.getElementById('modal-food-dropdown');
  if (!suggestions.length) { dd.classList.remove('open'); return; }
  renderDropdown(dd, suggestions, idx => selectModalFood(suggestions[idx]));
  dd.classList.add('open');
}

function selectModalFood(item) {
  const name = typeof item === 'string' ? item : item.name;
  if (!name.trim()) return;
  modalFoodItems.push(name.trim());
  document.getElementById('modal-food-input').value = '';
  document.getElementById('modal-food-dropdown').classList.remove('open');
  renderModalFoodList();
}

function onModalFoodKeydown(e) {
  const dd = document.getElementById('modal-food-dropdown');
  const items = dd.querySelectorAll('.autocomplete-item');
  if (e.key === 'Enter') {
    e.preventDefault();
    const idx = Array.from(items).findIndex(el => el.classList.contains('highlighted'));
    if (idx >= 0) items[idx].click();
    else { const v = document.getElementById('modal-food-input').value.trim(); if (v) selectModalFood(v); }
  } else if (e.key === 'Escape') { dd.classList.remove('open'); }
}

function renderModalFoodList() {
  const list = document.getElementById('modal-food-list');
  if (!list) return;
  list.innerHTML = modalFoodItems.map((item, i) => `
    <div class="food-chip">
      <span class="food-chip-name">🥗 ${escHtml(item)}</span>
      <button class="food-chip-remove" onclick="removeModalFood(${i})">×</button>
    </div>`).join('');
}

function removeModalFood(i) {
  modalFoodItems.splice(i, 1);
  renderModalFoodList();
}

// Modal obs type autocomplete
function onModalObsTypeInput(input) {
  const suggestions = getObsTypeSuggestions(input.value);
  const dd = document.getElementById('modal-obs-type-dropdown');
  if (!suggestions.length) { dd.classList.remove('open'); return; }
  renderDropdown(dd, suggestions, idx => {
    const name = typeof suggestions[idx] === 'string' ? suggestions[idx] : suggestions[idx].name;
    document.getElementById('modal-obs-type').value = name;
    dd.classList.remove('open');
  });
  dd.classList.add('open');
}

function onModalObsTypeKeydown(e) {
  if (e.key === 'Escape') document.getElementById('modal-obs-type-dropdown').classList.remove('open');
}

function saveEditedEntry() {
  const entries = getEntries();
  const idx = entries.findIndex(e => e.id === editingEntryId);
  if (idx < 0) return;

  const entry = entries[idx];
  const dtInput = document.getElementById('modal-datetime');
  if (dtInput && dtInput.value) entry.timestamp = new Date(dtInput.value).toISOString();

  if (entry.type === 'meal') {
    if (modalFoodItems.length === 0) { showToast('Add at least one food item'); return; }
    modalFoodItems.forEach(name => ensureFood(name));
    entry.payload.items = modalFoodItems.map(name => ({ name }));
  } else {
    const type = document.getElementById('modal-obs-type').value.trim();
    const notes = document.getElementById('modal-obs-notes').value.trim();
    if (!type) { showToast('Enter an observation type'); return; }
    ensureObsType(type);
    entry.payload.observationType = type;
    entry.payload.notes = notes;
  }

  entries[idx] = entry;
  saveEntries(entries);
  closeModal();
  renderHistory();
  showToast('✓ Entry updated');
}

function deleteEntry() {
  if (!confirm('Delete this entry?')) return;
  const entries = getEntries().filter(e => e.id !== editingEntryId);
  saveEntries(entries);
  closeModal();
  renderHistory();
  showToast('Entry deleted');
}

// ══════════════════════════════════════════
// EXPORT CSV
// ══════════════════════════════════════════
function exportCSV() {
  const entries = getEntries().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const rows = [['id', 'timestamp', 'type', 'details', 'notes']];
  entries.forEach(e => {
    let details = '', notes = '';
    if (e.type === 'meal') {
      details = (e.payload.items || []).map(i => i.name).join('; ');
    } else {
      details = e.payload.observationType || '';
      notes = e.payload.notes || '';
    }
    rows.push([e.id, e.timestamp, e.type, details, notes]);
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const today = new Date().toISOString().slice(0, 10);
  a.download = `healthlog-export-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ CSV downloaded');
}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function showView(view) {
  document.getElementById('view-entry').classList.toggle('active', view === 'entry');
  document.getElementById('view-history').classList.toggle('active', view === 'history');
  document.getElementById('nav-entry').classList.toggle('active', view === 'entry');
  document.getElementById('nav-history').classList.toggle('active', view === 'history');
  if (view === 'history') renderHistory();
  closeAllDropdowns();
}

function goToEntry() {
  showView('entry');
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrap') && !e.target.closest('.autocomplete-dropdown')) {
    closeAllDropdowns();
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
initStorage();
startClock();
</script>

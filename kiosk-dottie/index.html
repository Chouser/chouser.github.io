<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Display</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #content {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #status {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      font: 24px sans-serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
      background: #fff;
    }
  </style>
</head>

<body>

  <iframe
    id="content"
    title="Display content"
    referrerpolicy="no-referrer">
  </iframe>

  <div id="status">
    Unable to load the display configuration.
  </div>

  <script>
    /*
     * Example config.json:
     *
     * {
     *   "version": 1,
     *   "type": "google-doc",
     *   "url": "https://docs.google.com/document/d/e/.../pub?embedded=true",
     *   "iframeRefreshMinutes": 3
     * }
     */

    const CONFIG_URL = "./config.json";

    // Check the tiny configuration file every minute.
    const CONFIG_POLL_INTERVAL_MS = 60 * 1000;

    const iframe = document.getElementById("content");
    const status = document.getElementById("status");

    let currentVersion = null;
    let currentConfig = null;
    let lastGoodConfig = null;
    let iframeRefreshTimer = null;


    function showStatus() {
      if (!lastGoodConfig) {
        status.style.display = "flex";
      }
    }


    function hideStatus() {
      status.style.display = "none";
    }


    function validateConfig(config) {
      if (!config || typeof config !== "object") {
        throw new Error("Invalid configuration");
      }

      if (
        config.version === undefined ||
        config.version === null
      ) {
        throw new Error(
          "Configuration has no version"
        );
      }

      if (
        typeof config.type !== "string" ||
        typeof config.url !== "string"
      ) {
        throw new Error(
          "Configuration requires type and url"
        );
      }

      if (!/^https?:\/\//i.test(config.url)) {
        throw new Error(
          "Configuration URL must be http(s)"
        );
      }

      if (
        config.type !== "url" &&
        config.type !== "google-doc"
      ) {
        throw new Error(
          "Unsupported configuration type"
        );
      }

      /*
       * Default to 5 minutes if the setting is omitted.
       */
      let refreshMinutes = 5;

      if (
        config.iframeRefreshMinutes !== undefined
      ) {
        refreshMinutes =
          Number(config.iframeRefreshMinutes);
      }

      if (
        !Number.isFinite(refreshMinutes) ||
        refreshMinutes <= 0
      ) {
        throw new Error(
          "iframeRefreshMinutes must be greater than zero"
        );
      }

      return {
        ...config,
        iframeRefreshMinutes: refreshMinutes
      };
    }


    /*
     * Reload the iframe.
     *
     * Adding a timestamp makes this a new navigation rather than
     * simply assigning the exact same URL.
     */
    function refreshIframe() {
      if (!currentConfig) {
        return;
      }

      const url = currentConfig.url;

      const separator =
        url.indexOf("?") >= 0 ? "&" : "?";

      iframe.src =
        url +
        separator +
        "displayRefresh=" +
        Date.now();
    }


    function scheduleIframeRefresh() {
      if (iframeRefreshTimer) {
        clearTimeout(iframeRefreshTimer);
      }

      if (!currentConfig) {
        return;
      }

      const delay =
        currentConfig.iframeRefreshMinutes *
        60 *
        1000;

      iframeRefreshTimer = setTimeout(
        function () {

          refreshIframe();

          /*
           * Schedule the next refresh.
           */
          scheduleIframeRefresh();

        },
        delay
      );
    }


    function applyConfig(config) {
      /*
       * Change the actual displayed destination.
       */
      iframe.src = config.url;

      currentConfig = config;
      currentVersion = config.version;
      lastGoodConfig = config;

      try {
        localStorage.setItem(
          "lastGoodConfig",
          JSON.stringify(config)
        );
      } catch (_) {
        /*
         * localStorage is optional.
         */
      }

      hideStatus();

      scheduleIframeRefresh();
    }


    function loadLastGoodConfig() {
      try {
        const saved =
          localStorage.getItem(
            "lastGoodConfig"
          );

        if (!saved) {
          return;
        }

        const config =
          validateConfig(
            JSON.parse(saved)
          );

        currentConfig = config;
        currentVersion = config.version;
        lastGoodConfig = config;

        iframe.src = config.url;

        hideStatus();

        scheduleIframeRefresh();

      } catch (_) {
        /*
         * Ignore corrupt or stale local storage.
         */
      }
    }


    async function fetchConfig() {

      try {

        /*
         * Cache-bust the tiny configuration request.
         */
        const response = await fetch(
          CONFIG_URL +
            "?t=" +
            Date.now(),
          {
            cache: "no-store",
            credentials: "omit"
          }
        );


        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }


        const config =
          validateConfig(
            await response.json()
          );


        /*
         * Same version means nothing needs to happen.
         */
        if (
          currentVersion === null ||
          String(config.version) !==
            String(currentVersion)
        ) {
          applyConfig(config);
        }


      } catch (error) {

        /*
         * IMPORTANT:
         *
         * A configuration failure never causes a reload.
         * The currently displayed content remains untouched.
         */
        console.warn(
          "Configuration check failed:",
          error
        );


        if (!lastGoodConfig) {
          showStatus();
        }
      }
    }


    /*
     * Restore cached content immediately, then check GitHub.
     */
    loadLastGoodConfig();
    fetchConfig();


    /*
     * Check for configuration changes once per minute.
     */
    setInterval(
      fetchConfig,
      CONFIG_POLL_INTERVAL_MS
    );

  </script>

</body>
</html>

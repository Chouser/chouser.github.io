<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gallery Showcase</title>
    <style>
        /* Define color palette and basic reset */
        :root {
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --text-color: #333333;
            --author-color: #666666;
            --shadow: 0 4px 8px rgba(0,0,0,0.1);
            --toggle-link-color: #d0d0d0; /* Blends with background */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* The flex container for the cards */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            flex-grow: 1; /* Allow content to push the footer down */
            padding-bottom: 60px; /* Space for the footer */
        }

        /* Base card styling */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: calc(25% - 20px); /* 4 cards per row by default */
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        /* Image container and image styling */
        .image-container {
            width: 100%;
            position: relative;
            /* Force an aspect ratio for consistency */
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            background-color: #e0e0e0; /* Placeholder color while loading */
            overflow: hidden;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image fills the area */
            transition: opacity 0.3s ease-in-out;
            opacity: 0; /* Hidden initially until JS activates */
        }

        .image-container img.active {
            opacity: 1; /* Show the active image */
        }

        /* Details section of the card */
        .card-details {
            padding: 15px;
            border-top: 1px solid #eeeeee;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }

        .game-author {
            font-size: 0.9rem;
            color: var(--author-color);
            margin: 0;
        }

        /* Responsive breakpoints */
        @media (max-width: 900px) {
            .game-card {
                width: calc(50% - 20px); /* 2 cards per row */
            }
        }

        @media (max-width: 600px) {
            .game-card {
                width: 100%; /* 1 card per row */
            }
        }

        /* Footer styling for the toggle link */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        #view-toggle {
            color: var(--toggle-link-color);
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        #view-toggle:hover {
            color: var(--author-color); /* Slightly more visible on hover */
        }

    </style>
</head>
<body>

    <div class="gallery-container" id="gallery">
        </div>

    <footer>
        <a id="view-toggle">Toggle: Gameplay / Title Screens</a>
    </footer>

    <script>
        const games = [
            {
                title: "Splatter Maze",
                author: "Isaak",
                url: "https://scratch.mit.edu/projects/1304287056/fullscreen/",
                screenshot_src: "isaak-ss.png",
                title_screen_src: "isaak-ai.jpg"
            },
            {
                title: "Racekart",
                author: "Sam",
                url: "https://scratch.mit.edu/projects/1307556429/fullscreen/",
                screenshot_src: "sam-ss.png",
                title_screen_src: "sam-ai.jpg"
            },
            {
                title: "Wicked Witch Challenge",
                author: "Tre",
                url: "https://scratch.mit.edu/projects/1313189415/fullscreen/",
                screenshot_src: "tre-ss.png",
                title_screen_src: "tre-ai.jpg"
            },
            {
                title: "Almost Pacman",
                author: "Mr Houser",
                url: "https://scratch.mit.edu/projects/1312072803/fullscreen/",
                screenshot_src: "chouser-ss.png",
                title_screen_src: "chouser-ai.jpg"
            }
        ];

        // --- 2. LOGIC ---

        const container = document.getElementById('gallery');
        const toggleLink = document.getElementById('view-toggle');
        let currentViewIsTitleScreen = false;

        // Function to create and render all cards
function renderCards() {
    container.innerHTML = ''; 

    games.forEach((game) => {
        // Create an anchor tag to wrap the whole card
        const cardLink = document.createElement('a');
        cardLink.href = game.url;
        cardLink.style.textDecoration = 'none'; // Keeps title/author text looking clean
        cardLink.style.color = 'inherit';
        cardLink.className = 'game-card';
        // Ensure it behaves like a block for the layout
        cardLink.style.display = 'flex';

        // Image Container
        const imageContainer = document.createElement('div');
        imageContainer.className = 'image-container';

        const screenshotImg = document.createElement('img');
        screenshotImg.src = game.screenshot_src;
        screenshotImg.className = 'screenshot' + (!currentViewIsTitleScreen ? ' active' : '');

        const titleScreenImg = document.createElement('img');
        titleScreenImg.src = game.title_screen_src;
        titleScreenImg.className = 'title-screen' + (currentViewIsTitleScreen ? ' active' : '');

        imageContainer.appendChild(screenshotImg);
        imageContainer.appendChild(titleScreenImg);

        // Details Container
        const details = document.createElement('div');
        details.className = 'card-details';

        const title = document.createElement('h3');
        title.className = 'game-title';
        title.textContent = game.title;

        const author = document.createElement('p');
        author.className = 'game-author';
        author.textContent = `By ${game.author}`;

        details.appendChild(title);
        details.appendChild(author);

        // Assemble
        cardLink.appendChild(imageContainer);
        cardLink.appendChild(details);

        // Add to main container
        container.appendChild(cardLink);
    });
}
        // Toggle Functionality
        function toggleView() {
            currentViewIsTitleScreen = !currentViewIsTitleScreen;
            const allCards = document.querySelectorAll('.game-card');
            
            allCards.forEach(card => {
                const screenshot = card.querySelector('.screenshot');
                const titleScreen = card.querySelector('.title-screen');

                if (currentViewIsTitleScreen) {
                    screenshot.classList.remove('active');
                    titleScreen.classList.add('active');
                } else {
                    titleScreen.classList.remove('active');
                    screenshot.classList.add('active');
                }
            });
        }

        // --- 3. INITIALIZATION & EVENT LISTENERS ---

        renderCards(); // Initial build
        toggleLink.addEventListener('click', toggleView);

    </script>
</body>
</html>
